services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_USER: cadence
      MARIADB_PASSWORD: cadence
      MARIADB_DATABASE: cadence
    ports:
      - "3306:3306"
    volumes:
      - cadence-db:/var/lib/mysql
volumes:
  cadence-db:
