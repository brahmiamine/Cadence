<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17131f">
  <title>Ouvrir Cadence</title>
  <style>
    body{margin:0;padding:24px;min-height:100vh;min-height:100dvh;box-sizing:border-box;display:grid;place-items:center;background:#17131f;color:#f7f2ff;font:16px/1.5 system-ui,sans-serif;text-align:center}
    h1{margin:12px 0 6px}
    p{color:#c0b2d0}
    a{display:inline-block;margin-top:10px;padding:9px 15px;border-radius:8px;background:#c7b5ff;color:#21172f;font-weight:700}
  </style>
</head>
<body>
  <main>
    <img src="./assets/icon.svg" width="72" height="72" alt="">
    <h1>Cadence</h1>
    <p id="status" role="status">Préparation de l’application…</p>
    <a href="./">Ouvrir l’accueil</a>
  </main>
  <script type="module">
    const home = new URL('./', location.href);
    try {
      if ('serviceWorker' in navigator) {
        const workers = navigator.serviceWorker;
        const script = new URL('sw.js?v=7', home);
        await workers.register(script, {updateViaCache:'none'});
        const deadline = performance.now() + 8000;
        while (workers.controller?.scriptURL !== script.href && performance.now() < deadline) {
          await new Promise(resolve => setTimeout(resolve, 100));
        }
        if (workers.controller?.scriptURL !== script.href) throw new Error('Activation en attente');
      }
      location.replace(home.href);
    } catch {
      document.querySelector('#status').textContent = 'La mise à jour n’a pas abouti. Réessayez en rechargeant cette page.';
    }
  </script>
</body>
</html>
